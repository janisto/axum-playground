name: Workflow security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: zizmor
    permissions:
      contents: read
      security-events: write # Required to upload zizmor SARIF results.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.1
