[graph]
all-features = true

[advisories]
ignore = [
    # Firestore 0.61.1 still requires backoff 0.4.0, which depends on instant 0.1.13.
    # Both advisories mark unmaintained crates; no compatible upstream replacement exists.
    "RUSTSEC-2024-0384",
    "RUSTSEC-2025-0012",
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
